; USB continuity helper for identifying DIN-8 cable colours.
; Probe D2 (INPUT_PULLUP) against Nano GND.
[platformio]
src_dir = src
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:nanoatmega328]
board = nanoatmega328

[env:nanoatmega328new]
board = nanoatmega328new
