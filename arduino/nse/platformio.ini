; PlatformIO project — Arduino NSE (Ethernet HTTP(S) ↔ RHTTP UART)
; Pick a TLS-capable board for Slack. Default env is for bring-up on ESP32 + W5500.
[platformio]
src_dir = src
include_dir = include

[env:esp32_w5500]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  -D RHTTP_USE_ETHERNET=1
  -I ../../protocol
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
monitor_speed = 115200

[env:uno_w5500_cleartext]
; Cleartext HTTP only — not for Slack TLS
platform = atmelavr
board = uno
framework = arduino
build_flags =
  -D RHTTP_CLEARTEXT_ONLY=1
  -I ../../protocol
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
monitor_speed = 9600
